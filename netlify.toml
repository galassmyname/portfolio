# Netlify configuration for the portfolio (static, prerendered by `npm run build`).

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # Public address of the site: used for canonical URLs, hreflang, Open Graph,
  # JSON-LD and sitemap.xml. Not a secret. Change it if a custom domain is added.
  VITE_SITE_URL = "https://dazzling-klepon-5bf509.netlify.app"
  # VITE_WEB3FORMS_ACCESS_KEY is set in the Netlify UI (Site settings → Environment variables).

# Hashed build assets and self-hosted fonts never change: cache them for a year.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
